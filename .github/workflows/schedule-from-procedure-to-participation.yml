name: Publicar From Procedure to Participation (programado)

# Fusiona la rama deploy/from-procedure-to-participation en main, construye y
# despliega el 6 de junio de 2026 a las 15:00 UTC (17:00 CEST). Tras publicar,
# se autoelimina para no volver a ejecutarse. Tambien se puede lanzar a mano.

on:
  schedule:
    - cron: "0 15 6 6 *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Comprobar fecha programada
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%Y-%m-%d)" = "2026-06-06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fuera de la fecha programada (6 jun 2026); no se publica."
          fi

      - name: Checkout main
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fusionar deploy/from-procedure-to-participation y limpiar
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin deploy/from-procedure-to-participation
          git merge --no-edit origin/deploy/from-procedure-to-participation
          git rm -q .github/workflows/schedule-from-procedure-to-participation.yml
          git commit -m "feat(from-procedure-to-participation): publicacion programada (6 jun 2026)"
          git push origin main
          git push origin --delete deploy/from-procedure-to-participation || true

      - name: Setup Node.js
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci

      - name: Build
        if: steps.guard.outputs.run == 'true'
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: steps.guard.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
