name: Publicar Be Eco (programado)

# Fusiona la rama deploy/be-eco en main, construye y despliega el 4 de junio
# de 2026 a las 16:00 UTC (18:00 CEST). Tras publicar, se autoelimina para no
# volver a ejecutarse. Tambien se puede lanzar a mano con "Run workflow".

on:
  schedule:
    - cron: "0 16 4 6 *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Comprobar fecha programada
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%Y-%m-%d)" = "2026-06-04" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fuera de la fecha programada (4 jun 2026); no se publica."
          fi

      - name: Checkout main
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fusionar deploy/be-eco y limpiar
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin deploy/be-eco
          git merge --no-edit origin/deploy/be-eco
          git rm -q .github/workflows/schedule-be-eco.yml
          git commit -m "feat(be-eco): publicacion programada (4 jun 2026)"
          git push origin main
          git push origin --delete deploy/be-eco || true

      - name: Setup Node.js
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci

      - name: Build
        if: steps.guard.outputs.run == 'true'
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: steps.guard.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
